services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Defina MYSQL_ROOT_PASSWORD no .env}
      MYSQL_DATABASE: ${DB_NAME:-obreiro_digital}
      MYSQL_USER: ${DB_USER:-obreiro}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no .env}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      - "127.0.0.1:3307:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysql -h 127.0.0.1 -u \"$$MYSQL_USER\" -p\"$$MYSQL_PASSWORD\" -e 'SELECT 1' \"$$MYSQL_DATABASE\" >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  api:
    build:
      context: .
    environment:
      API_PORT: 3333
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-obreiro_digital}
      DB_USER: ${DB_USER:-obreiro}
      DB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no .env}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no .env}
      EMAIL_CONTATO: ${EMAIL_CONTATO:-}
      SENHA_CONTATO: ${SENHA_CONTATO:-}
    ports:
      - "3333:3333"
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:
