# Entrada do Obreiro Digital. Recebe a rede local (porta 80 do container) e o tráfego do
# Cloudflare Tunnel. O TLS termina na Cloudflare; o túnel até aqui já é criptografado.

# IP real do visitante quando a requisição veio pela Cloudflare.
map $http_cf_connecting_ip $visitor_ip {
  ""      $remote_addr;
  default $http_cf_connecting_ip;
}

# A Cloudflare informa o protocolo original; pela rede local é http.
map $http_x_forwarded_proto $forwarded_proto {
  ""      $scheme;
  default $http_x_forwarded_proto;
}

upstream obreiro_frontend {
  server frontend:3000;
  keepalive 16;
}

upstream obreiro_api {
  server api:3333;
  keepalive 16;
}

server {
  listen 80;
  server_name _;

  client_max_body_size 1m;
  server_tokens off;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml;
  gzip_min_length 1024;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  # O que é comum às duas origens: Host original (a API compara com o Origin), IP e protocolo.
  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-Host $http_host;
  proxy_set_header X-Forwarded-Proto $forwarded_proto;
  proxy_set_header X-Forwarded-For $visitor_ip;
  proxy_set_header X-Real-IP $visitor_ip;

  # API: /api/login chega na API como /login.
  location /api/ {
    proxy_pass http://obreiro_api/;
    proxy_read_timeout 60s;
  }

  # Arquivos do build têm nome com hash: cache longo.
  location /_next/static/ {
    proxy_pass http://obreiro_frontend;
    expires 365d;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    proxy_pass http://obreiro_frontend;
    proxy_read_timeout 60s;
  }
}
