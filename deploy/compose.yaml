# Obreiro Digital numa máquina só (TrueNAS SCALE ou qualquer Linux com Docker).
#
#   Pastas lado a lado:  <base>/obreiro-digital-api  e  <base>/Obreiro-Digital
#   cd <base>/obreiro-digital-api/deploy && cp .env.example .env   # preencha (docs/DEPLOY.md)
#   docker compose up -d --build
#
# Serviços (um processo cada):
#   db          MySQL 8.4; o schema inicial vem de docker/mysql/init.sql (só no primeiro start)
#   api         API Express, alcançável só dentro da rede do compose
#   frontend    Next.js (standalone), também só dentro da rede do compose
#   nginx       entrada única: "/" para o site e "/api" para a API; porta LAN_PORT na rede local
#   cloudflared endereço público HTTPS pelo Cloudflare Tunnel (perfil "public")
#   backup      dump diário do banco em ./backups (gzip), guardando BACKUP_KEEP_DAYS dias

name: obreiro

x-restart: &restart
  restart: unless-stopped

services:
  db:
    <<: *restart
    image: mysql:8.4.8
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?defina no .env}
      MYSQL_DATABASE: ${DB_NAME:-obreiro_digital}
      MYSQL_USER: ${DB_USER:-obreiro}
      MYSQL_PASSWORD: ${DB_PASSWORD:?defina no .env}
      TZ: America/Sao_Paulo
    command: ["--innodb-buffer-pool-size=${DB_BUFFER_POOL:-256M}"]
    mem_limit: ${DB_MEM_LIMIT:-768m}
    volumes:
      - db-data:/var/lib/mysql
      - ../docker/mysql/init.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysql -h 127.0.0.1 -u \"$$MYSQL_USER\" -p\"$$MYSQL_PASSWORD\" -e 'SELECT 1' \"$$MYSQL_DATABASE\" >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s

  api:
    <<: *restart
    build:
      context: ..
    image: obreiro-api
    mem_limit: ${API_MEM_LIMIT:-256m}
    environment:
      NODE_ENV: production
      API_PORT: 3333
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-obreiro_digital}
      DB_USER: ${DB_USER:-obreiro}
      DB_PASSWORD: ${DB_PASSWORD:?defina no .env}
      JWT_SECRET: ${JWT_SECRET:?defina no .env}
      # O site chama a API no mesmo endereço (/api): a própria origem já é aceita.
      # Liste aqui só origens extras (ex.: outro domínio), separadas por vírgula.
      CORS_ORIGINS: ${APP_URL:-http://localhost:${LAN_PORT:-8080}}
      # Secure só quando o acesso veio por HTTPS (túnel); na rede local o acesso é HTTP.
      COOKIE_SECURE: auto
      # Só o nginx (rede interna do compose) fala com a API; ele informa IP e protocolo reais.
      TRUST_PROXY_CIDRS: uniquelocal
      EMAIL_CONTATO: ${EMAIL_CONTATO:-}
      SENHA_CONTATO: ${SENHA_CONTATO:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      TZ: America/Sao_Paulo
    expose:
      - "3333"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    <<: *restart
    build:
      context: ../../Obreiro-Digital
      dockerfile: Dockerfile.staging
      args:
        # Caminho relativo: o mesmo build funciona pela rede local e pelo domínio.
        NEXT_PUBLIC_API_URL: /api
    image: obreiro-frontend
    mem_limit: ${FRONTEND_MEM_LIMIT:-384m}
    expose:
      - "3000"
    depends_on:
      api:
        condition: service_healthy

  nginx:
    <<: *restart
    image: nginx:1.27-alpine
    ports:
      # Rede local: http://<servidor>:8080. O acesso público passa pelo túnel.
      - "${LAN_PORT:-8080}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
      api:
        condition: service_healthy

  cloudflared:
    <<: *restart
    image: cloudflare/cloudflared:2024.12.2
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
      # QUIC (UDP 7844) costuma ser bloqueado em roteador doméstico; HTTP/2 usa TCP 443.
      TUNNEL_TRANSPORT_PROTOCOL: http2
    depends_on:
      - nginx
    profiles: ["public"]

  backup:
    <<: *restart
    image: mysql:8.4.8
    entrypoint: ["bash", "/backup/loop.sh"]
    environment:
      DB_NAME: ${DB_NAME:-obreiro_digital}
      DB_USER: ${DB_USER:-obreiro}
      DB_PASSWORD: ${DB_PASSWORD:?defina no .env}
      BACKUP_AT: ${BACKUP_AT:-03:30}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      TZ: America/Sao_Paulo
    mem_limit: 256m
    volumes:
      - ./backup:/backup:ro
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
